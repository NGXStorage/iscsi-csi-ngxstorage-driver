apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: iscsi-csi-ngxstorage
provisioner: iscsi.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  blocksize: "128k"
  thin_provision: "true"
  deduplication: "false"
  compression: "false"
  io_type: "transactional"
  qos_priority: "16"
