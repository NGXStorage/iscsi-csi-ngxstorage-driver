apiVersion: v1
kind: ServiceAccount
metadata:
  name: iscsi-csi-ngxstorage-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iscsi-csi-ngxstorage-node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iscsi-csi-ngxstorage-controller
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  # external-resizer requires pods get/list/watch for online expansion: it
  # lists pods to resolve NodeExpand targets, and its pod informer never
  # syncs without this rule (observed live: zero ControllerExpand RPCs, PVC
  # stuck 11 min). Controller SA only; node SAs keep no pods access beyond
  # the 11.1 destructive-holder pods/get exception.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iscsi-csi-ngxstorage-controller
subjects:
  - kind: ServiceAccount
    name: iscsi-csi-ngxstorage-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iscsi-csi-ngxstorage-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iscsi-csi-ngxstorage-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iscsi-csi-ngxstorage-leader-election
subjects:
  - kind: ServiceAccount
    name: iscsi-csi-ngxstorage-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iscsi-csi-ngxstorage-leader-election
