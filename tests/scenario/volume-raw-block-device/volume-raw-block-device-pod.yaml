apiVersion: v1
kind: Pod
metadata:
  name: volume-raw-block-device-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: volume-raw-block-device
    image: busybox
    command: ["sleep", "3600"]
    volumeDevices:
    - name: volume-raw-block-device-pvc
      devicePath: /dev/xvda
  volumes:
  - name: volume-raw-block-device-pvc
    persistentVolumeClaim:
      claimName: volume-raw-block-device-pvc
