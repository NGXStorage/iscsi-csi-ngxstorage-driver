apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-existing-static-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  volumeName: volume-existing-static-pv
  resources:
    requests:
      storage: 1Gi
  storageClassName: volume-existing-static-sc
