apiVersion: v1
kind: Pod
metadata:
  name: volume-access-rwop-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: volume-access-rwop
    image: nginx

    volumeMounts:
    - name: volume-access-rwop-pvc
      mountPath: /data
      readOnly: false

  volumes:
  - name: volume-access-rwop-pvc
    persistentVolumeClaim:
      claimName: volume-access-rwop-pvc
