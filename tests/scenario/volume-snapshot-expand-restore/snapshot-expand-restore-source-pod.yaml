apiVersion: v1
kind: Pod
metadata:
  name: snapshot-expand-restore-source-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: source
    image: nginx
    command: ["/bin/sh", "-c"]
    args:
    - >
      dd if=/dev/urandom of=/data/marker bs=1M count=256 status=none;
      sync;
      tail -f /dev/null
    volumeMounts:
    - name: source
      mountPath: /data
  volumes:
  - name: source
    persistentVolumeClaim:
      claimName: snapshot-expand-restore-source-pvc
