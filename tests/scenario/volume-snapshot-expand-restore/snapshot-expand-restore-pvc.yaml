apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshot-expand-restore-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: snapshot-expand-restore-snapshot
  resources:
    requests:
      storage: 2Gi
  storageClassName: snapshot-expand-restore-sc
