apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: filesystem-xfs-sc
provisioner: iscsi.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  fstype: "xfs" # ext4 (default) | xfs
  blocksize: "128k"
  thin_provision: "on"
  deduplication: "off"
  compression: "off"
  io_type: "sequential"
  qos_priority: "4"
