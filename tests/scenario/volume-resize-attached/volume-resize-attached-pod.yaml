apiVersion: v1
kind: Pod
metadata:
  name: extend-attached-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: extend-attached
    image: nginx
    volumeMounts:
    - name: extend-attached-pvc
      mountPath: /data
      readOnly: false
  volumes:
  - name: extend-attached-pvc
    persistentVolumeClaim:
      claimName: extend-attached-pvc
