apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readonly-multipod-pod-b
  namespace: default
spec:
  # The executor substitutes the real worker node hostnames before apply so
  # the fixture pins two pods to two different nodes on either cluster.
  nodeSelector:
    kubernetes.io/hostname: __NODE_B__
  containers:
  - name: ro-b
    image: nginx
    volumeMounts:
    - name: pvc
      mountPath: /data
      readOnly: true
  volumes:
  - name: pvc
    persistentVolumeClaim:
      claimName: volume-access-readonly-multipod-pvc
      # Volume-level readOnly drives the kubelet CSI NodePublish readonly
      # flag; the container mount-level readOnly below is not sufficient.
      readOnly: true
