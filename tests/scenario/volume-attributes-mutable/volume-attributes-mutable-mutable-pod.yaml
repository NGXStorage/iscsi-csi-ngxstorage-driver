apiVersion: v1
kind: Pod
metadata:
  name: volume-attributes-mutable-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: vac
    image: nginx
    volumeMounts:
    - name: volume-attributes-mutable-pvc
      mountPath: /data
  volumes:
  - name: volume-attributes-mutable-pvc
    persistentVolumeClaim:
      claimName: volume-attributes-mutable-pvc
